# Example public edge. Replace the TEST-NET address with your private app host.
server {
    listen 80;
    listen [::]:80;
    server_name haru.example.com;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name haru.example.com;

    ssl_certificate /etc/letsencrypt/live/haru.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haru.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location / {
        proxy_pass http://192.0.2.10:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
